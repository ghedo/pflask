name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install pkg-config libdbus-1-dev libcap-ng-dev

    - name: Configure
      run: |
        ./bootstrap.py
        ./waf configure

    - name: Build
      run: ./waf build
